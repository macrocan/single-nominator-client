worker_processes                auto; # it will be determinate automatically by the number of core
error_log                       /dev/stdout warn;

events {
    worker_connections          1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    tcp_nopush                  on;
    tcp_nodelay                 on;
    access_log                  /dev/stdout;
    keepalive_timeout           3000;
    types_hash_max_size         2048;
    server_names_hash_bucket_size   128;
    charset                         utf-8;

    gzip                            on;
    gzip_disable                    "msie6";
    server_tokens                   off;

    server {
        server_name             _;
        listen                  80;
        root                    /app/lib/single-nominator-client/single-nominator-client/dist;
        index                   index.html index.htm;
        client_max_body_size    32m;
        error_page              500 502 503 504  /50x.html;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://ton.access.orbs.network https://*.tonconnect.org wss://bridge.tonapi.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;


        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location = / {
            return 301 /single-nominator-client/;
        }

        location = /single-nominator-client {
            return 301 /single-nominator-client/;
        }

        location /single-nominator-client/ {
            alias /app/lib/single-nominator-client/single-nominator-client/dist/;
            index index.html;
            try_files $uri $uri/ /single-nominator-client/index.html;
        }
    }
}
